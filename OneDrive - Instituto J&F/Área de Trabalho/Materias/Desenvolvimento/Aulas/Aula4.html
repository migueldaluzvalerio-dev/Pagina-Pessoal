<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista</title>
</head>
<body>
    <p>
    <h1>Listas em HTML</h1>
    Lista não ordenada -
    <ul>
    <li>Item</li>
    <li>Item 2</li>
    </ul>
    <br>
    Lista ordenada -
    <ol>
    <li>Item</li>
    <li>Item 2</li>
    </ol>
    <br>
    Lista ordenada com start 10- 
    <ol start="10">
    <li>Item</li>
    <li>Item 2</li>
    </ol>
    
    </p>
</body>
</html>
